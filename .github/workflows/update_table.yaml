name: update_readme_table

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'

jobs:
  update_readme_table:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Cache Rust binary
        id: rust-binary
        uses: actions/cache@v6
        with:
          path: target/release/pepy-tech-stats
          key: ${{ runner.os }}-rust-binary-v2-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'src/**/*.rs') }}

      - name: Show cache status
        run: |
          echo "Cache hit: ${{ steps.rust-binary.outputs.cache-hit }}"
          if [ -f target/release/pepy-tech-stats ]; then
            ls -lh target/release/pepy-tech-stats
          else
            echo "Binary not restored"
          fi

      - name: Build Rust binary
        if: steps.rust-binary.outputs.cache-hit != 'true'
        run: cargo build --locked --release

      - name: Run binary
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          git status
          ./target/release/pepy-tech-stats --api-key "$API_KEY"

      - name: Checkout branch
        run: |
          git fetch origin main
          git checkout main
          git pull origin main

      - name: commit and push data
        env:
          CI_COMMIT_MESSAGE: "run: update readme table"
          CI_COMMIT_AUTHOR: table_update
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "${{ env.CI_COMMIT_AUTHOR }}"
          git config --global user.email "username@users.noreply.github.com"
          git status
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "${{ env.CI_COMMIT_MESSAGE }}"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" main
          else
            echo "No changes to commit"
          fi
